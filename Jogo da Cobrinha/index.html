<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=play_circle"
    />
    <title>Jogo da Cobrinha</title>
  </head>
  <body>
    <header>
      <span>
        Tutorial desenvolvido por
        <a href="https://youtu.be/LyWSsZktVOg" target="_blank">
          Manual do Dev
        </a>
      </span>
    </header>

    <div class="score">
      Pontos:
      <span class="value">00</span>
    </div>

    <div class="menu">
      <span class="game-over">Game Over</span>
      <span class="finish-score">
        Pontuação final:
        <span>00</span>
      </span>

      <button type="button" class="btn-play">
        <span class="material-symbols-outlined">play_circle</span>
        Jogar novamente
      </button>
    </div>

    <canvas width="600" height="600"></canvas>
    <script src="script.js"></script>
  </body>
</html>
